services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - default
      - web


  app:
    build: .
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - UPLOAD_DIR=/app/uploads
      - WEBDAV_ROOT_DIR=/app/webdav
      - GALLERY_ROOT_DIR=/app/gallery
      - MAE_PASSWORD=${MAE_PASSWORD}
      - MAE_TITLE=${MAE_TITLE}
      - WEBDAV_DROP_USERNAME=${WEBDAV_DROP_USERNAME}
      - WEBDAV_DROP_PASSWORD=${WEBDAV_DROP_PASSWORD}
      - CAMERA_ROOT_DIR=/app/webdav/cameras
      - CAMERA_THUMBS_DIR=/app/camera-thumbs
      - CAMERA_NTFY_URL=${CAMERA_NTFY_URL:-https://ntfy.sh}
      - CAMERA_NTFY_TOPIC=${CAMERA_NTFY_TOPIC:-}
    volumes:
      - uploads:/app/uploads
      - webdav_data:/app/webdav
      # Camera clips (WebDAV user "cameras") live on the dedicated 15 GB
      # Hetzner volume, never on the root disk. deploy.sh refuses to deploy
      # if the volume or its marker file is missing.
      - /mnt/HC_Volume_107526857/cameras:/app/webdav/cameras
      - gallery_data:/app/gallery
      - camera_thumbs:/app/camera-thumbs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  webdav_data:
  gallery_data:
  camera_thumbs:

networks:
  web:
    external: true